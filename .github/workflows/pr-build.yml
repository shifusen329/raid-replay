name: Build and test Raid Replay

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

jobs:

  build:
    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Download Dalamud
      run: |
        Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
        Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

    - name: Build with dotnet
      run: dotnet build RaidReplay.slnx --configuration Release

    - name: Test
      # Integration tests that need the local ACT log folder (LOGS_PATH) are skipped automatically.
      run: dotnet test RaidReplay.Core.Tests --configuration Release --no-build

    - name: Store artifacts
      uses: actions/upload-artifact@v4
      with:
        name: RaidReplay
        path: .\RaidReplay\bin\x64\Release\RaidReplay\*
        if-no-files-found: error
        retention-days: 7
